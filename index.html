<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dulce Compañía – Próximamente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --violet: #5B4FCF;
      --violet-light: #8B82E0;
      --violet-pale: #EAE8F9;
      --cream: #FAF7F2;
      --amber: #F5A623;
      --dark: #1A1625;
      --text: #3D3553;
      --text-light: #7A7090;
      --white: #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── ANIMATED BACKGROUND ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: var(--cream);
      overflow: hidden;
    }

    .blob {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.55;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob-1 {
      width: 520px; height: 520px;
      background: var(--violet-pale);
      top: -120px; left: -100px;
      animation-duration: 14s;
    }
    .blob-2 {
      width: 380px; height: 380px;
      background: rgba(245,166,35,0.18);
      bottom: -80px; right: -60px;
      animation-duration: 10s; animation-delay: -4s;
    }
    .blob-3 {
      width: 260px; height: 260px;
      background: rgba(91,79,207,0.12);
      top: 40%; left: 60%;
      animation-duration: 16s; animation-delay: -7s;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* ── DECORATIVE CIRCLES ── */
    .ring {
      position: fixed; border-radius: 50%;
      border: 1px solid rgba(91,79,207,0.12);
      pointer-events: none; z-index: 0;
    }
    .ring-1 { width: 600px; height: 600px; top: -200px; right: -150px; }
    .ring-2 { width: 340px; height: 340px; bottom: 60px; left: -100px; border-color: rgba(245,166,35,0.2); }
    .ring-3 { width: 180px; height: 180px; top: 30%; left: 5%; border-color: rgba(91,79,207,0.08); }

    /* ── LAYOUT ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }

    .card {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 2.5rem;
      padding: 3.5rem 3rem;
      max-width: 480px; width: 100%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(91,79,207,0.13), 0 2px 8px rgba(0,0,0,0.04);
      animation: riseIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── LOGO MARK ── */
    .logo-mark {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-bottom: 2rem;
      animation: riseIn 0.8s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }
    .logo-mark span {
      font-family: 'Playfair Display', serif;
      font-size: 1rem; font-weight: 700;
      color: var(--violet); letter-spacing: 0.02em;
    }

    /* ── PHOTO ── */
    .photo-wrap {
      position: relative; display: inline-block;
      margin-bottom: 2rem;
      animation: riseIn 0.8s 0.15s cubic-bezier(0.22,1,0.36,1) both;
    }

    .photo-wrap img {
      width: 130px; height: 130px;
      border-radius: 50%;
      object-fit: cover; object-position: top center;
      display: block;
      border: 3px solid var(--white);
      box-shadow: 0 8px 32px rgba(91,79,207,0.2);
    }

    .photo-ring {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 2px dashed rgba(91,79,207,0.25);
      animation: spin 20s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .photo-dot {
      position: absolute; bottom: 6px; right: 6px;
      width: 18px; height: 18px;
      background: var(--amber);
      border-radius: 50%;
      border: 2px solid var(--white);
      box-shadow: 0 2px 8px rgba(245,166,35,0.4);
    }

    /* ── BADGE ── */
    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--violet-pale); color: var(--violet);
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.35rem 0.9rem;
      border-radius: 50px; margin-bottom: 1.2rem;
      animation: riseIn 0.8s 0.2s cubic-bezier(0.22,1,0.36,1) both;
    }
    .badge-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--violet);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── HEADLINE ── */
    .headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      color: var(--dark); line-height: 1.15;
      margin-bottom: 1rem;
      animation: riseIn 0.8s 0.25s cubic-bezier(0.22,1,0.36,1) both;
    }
    .headline em { color: var(--violet); font-style: italic; }

    /* ── SUBTEXT ── */
    .subtext {
      font-size: 0.95rem; color: var(--text-light);
      line-height: 1.75; margin-bottom: 0.6rem;
      animation: riseIn 0.8s 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }

    .name-line {
      font-size: 0.85rem; color: var(--text);
      font-weight: 500; margin-bottom: 2.5rem;
      animation: riseIn 0.8s 0.33s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 2rem;
      animation: riseIn 0.8s 0.35s cubic-bezier(0.22,1,0.36,1) both;
    }
    .divider-line { flex: 1; height: 1px; background: rgba(91,79,207,0.15); }
    .divider-icon { font-size: 1rem; }

    /* ── WA BUTTON ── */
    .wa-btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.65rem;
      background: #25D366; color: var(--white);
      padding: 1rem 2rem; border-radius: 50px;
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      box-shadow: 0 6px 24px rgba(37,211,102,0.35);
      transition: all 0.22s;
      animation: riseIn 0.8s 0.4s cubic-bezier(0.22,1,0.36,1) both;
      width: 100%;
    }
    .wa-btn:hover {
      background: #1fb958;
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(37,211,102,0.4);
    }
    .wa-btn svg { flex-shrink: 0; }

    /* ── FOOTER NOTE ── */
    .footer-note {
      margin-top: 2rem;
      font-size: 0.75rem; color: var(--text-light);
      animation: riseIn 0.8s 0.45s cubic-bezier(0.22,1,0.36,1) both;
    }
    .footer-note a { color: var(--violet); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 2.5rem 1.5rem; border-radius: 1.8rem; }
    }
  </style>
</head>
